<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kochbuch</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kochbuch">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <button id="btn-back" class="icon-btn" hidden aria-label="Zurück">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h11"></path></svg>
  </button>
  <span class="brand-mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M3.5 5.5c3.1-1.2 6-.7 8.5 1.3v14c-2.5-2-5.4-2.5-8.5-1.3v-14Z"></path>
      <path d="M20.5 5.5c-3.1-1.2-6-.7-8.5 1.3v14c2.5-2 5.4-2.5 8.5-1.3v-14Z"></path>
    </svg>
  </span>
  <h1 id="page-title">Kochbuch</h1>
  <div class="topbar-actions">
    <button id="btn-data-menu" class="icon-btn" aria-label="Export / Import">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="5" cy="12" r="1"></circle><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle></svg>
    </button>
    <button id="btn-add" class="icon-btn" aria-label="Rezept hinzufügen">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </div>
</header>

<main id="app"></main>

<!-- Templates -->
<template id="tpl-overview">
  <div class="controls">
    <input id="search" type="search" placeholder="Rezept oder Zutat suchen…">
    <div id="tag-filter" class="chips"></div>
    <div class="controls-row">
      <button id="btn-ingredient-filter" class="btn-secondary ingredient-filter-btn">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M7 12h10m-7 6h4"></path><circle cx="8" cy="6" r="1.5"></circle><circle cx="15" cy="12" r="1.5"></circle><circle cx="11" cy="18" r="1.5"></circle></svg>
        <span>Nach Zutaten filtern</span>
      </button>
      <div class="sort-control">
        <button id="sort-select" class="sort-trigger" type="button" aria-label="Sortierung" aria-haspopup="listbox" aria-expanded="false" aria-controls="sort-menu">
          <span id="sort-label"></span>
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 10 5 5 5-5"></path></svg>
        </button>
        <div id="sort-menu" class="sort-menu" role="listbox" aria-label="Sortierung" hidden>
                <button class="sort-option" type="button" role="option" data-value="added" aria-selected="false">Zuletzt hinzugefügt</button>
          <button class="sort-option" type="button" role="option" data-value="alpha" aria-selected="false">Alphabetisch</button>
          <button class="sort-option" type="button" role="option" data-value="cooked" aria-selected="false">Zuletzt gekocht</button>
          <button class="sort-option" type="button" role="option" data-value="favorites" aria-selected="false">Favoriten</button>
        </div>
      </div>
    </div>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty-state" class="empty" hidden>
    <svg class="empty-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <path d="M8 13c8-3 16-1.8 24 3v36c-8-4.8-16-6-24-3V13Z"></path>
      <path d="M56 13c-8-3-16-1.8-24 3v36c8-4.8 16-6 24-3V13Z"></path>
    </svg>
    <p class="empty-message">Noch keine Rezepte. Tippe oben rechts auf „+“, um eines hinzuzufügen.</p>
  </div>
</template>

<template id="tpl-ingredient-filter">
  <div class="sheet">
    <h2>Nach vorhandenen Zutaten filtern</h2>
    <p class="hint">Zutaten auswählen. Es werden Rezepte angezeigt, die alle ausgewählten Zutaten enthalten; weitere Zutaten sind erlaubt.</p>
    <input id="ingredient-filter-search" type="search" placeholder="Zutat suchen…">
    <div id="ingredient-checklist" class="ingredient-checklist"></div>
    <div class="form-actions">
      <button id="ingredient-filter-apply" class="btn-primary">Anwenden</button>
      <button id="ingredient-filter-reset" class="btn-secondary">Zurücksetzen</button>
    </div>
  </div>
</template>

<template id="tpl-tile">
  <button class="tile">
    <div class="tile-img"></div>
    <div class="tile-body">
      <span class="tile-cat"></span>
      <h3 class="tile-title"></h3>
    </div>
  </button>
</template>

<template id="tpl-detail">
  <article class="detail">
    <div class="detail-img"></div>
    <h2 class="d-title"></h2>
    <p class="d-meta"></p>
    <div class="servings-control">
      <span>Portionen:</span>
      <button class="serv-btn" data-delta="-1">–</button>
      <span class="serv-count"></span>
      <button class="serv-btn" data-delta="1">+</button>
    </div>
    <label class="wake-lock-toggle">
      <input type="checkbox" class="wake-lock-checkbox">
      Bildschirm beim Kochen an lassen
    </label>
    <button class="btn-cook-mode">Kochmodus starten</button>
    <section>
      <h3>Zutaten</h3>
      <ul class="ingredient-list"></ul>
    </section>
    <section>
      <h3>Zubereitung</h3>
      <ol class="step-list"></ol>
    </section>
    <div class="detail-actions compact">
      <button class="btn-favorite" type="button">☆ Favorit</button>
      <button class="btn-share">Teilen</button>
      <button class="btn-pdf">PDF</button>
    </div>
    <div class="rating-panel">
      <span>Bewertung</span>
      <div class="star-rating" aria-label="Bewertung">
        <button class="star" type="button" data-value="1" aria-label="1 Stern">★</button>
        <button class="star" type="button" data-value="2" aria-label="2 Sterne">★</button>
        <button class="star" type="button" data-value="3" aria-label="3 Sterne">★</button>
        <button class="star" type="button" data-value="4" aria-label="4 Sterne">★</button>
        <button class="star" type="button" data-value="5" aria-label="5 Sterne">★</button>
      </div>
    </div>
    <label class="notes-block">
      <span>Notiz / Kommentar</span>
      <textarea class="recipe-notes" rows="3" placeholder="Notiz für dieses Rezept…"></textarea>
    </label>
    <div class="detail-actions">
      <button class="btn-cooked">Heute gekocht</button>
    </div>
    <div class="detail-actions">
      <button class="btn-edit">Bearbeiten</button>
      <button class="btn-delete">Löschen</button>
    </div>
  </article>
</template>

<template id="tpl-cook">
  <div class="cook">
    <div class="cook-progress"><div class="cook-progress-bar"></div></div>
    <div class="cook-timer">
      <div class="cook-timer-header">
        <span>Timer</span>
        <button type="button" class="cook-timer-reset">Zurücksetzen</button>
      </div>
      <div class="cook-timer-controls">
        <input class="cook-timer-minutes" type="number" min="0" max="180" step="1" value="5">
        <button type="button" class="cook-timer-start">Start</button>
        <button type="button" class="cook-timer-pause">Pause</button>
      </div>
      <p class="cook-timer-display">05:00</p>
    </div>
    <p class="cook-counter"></p>
    <div class="cook-step"></div>
    <div class="cook-nav">
      <button class="cook-btn cook-prev">‹ Zurück</button>
      <button class="cook-btn cook-ingredients-btn">Zutaten</button>
      <button class="cook-btn cook-next">Weiter ›</button>
    </div>
    <div class="cook-ingredients" hidden>
      <div class="cook-ingredients-inner">
        <h3 class="cook-ingredients-title">Zutaten</h3>
        <ul class="ingredient-list"></ul>
        <button class="btn-primary cook-ingredients-close">Los geht's</button>
      </div>
    </div>
  </div>
</template>

<template id="tpl-data-menu">
  <div class="sheet">
    <h2>Rezepte sichern</h2>
    <button id="data-export" class="sheet-option">
      <svg class="option-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 17v3h14v-3"></path></svg>
      <span>Alle Rezepte exportieren (Datei)</span>
    </button>
    <button id="data-sync-link" class="sheet-option">
      <svg class="option-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10 13a5 5 0 0 1 0-7l1-1a5 5 0 0 1 7 7l-1 1M14 11a5 5 0 0 1 0 7l-1 1a5 5 0 1 1-7-7l1-1"></path></svg>
      <span>Backup-Link zum Teilen erstellen</span>
    </button>
    <button id="data-import" class="sheet-option">
      <svg class="option-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15V3m0 0L8 7m4-4 4 4M5 17v3h14v-3"></path></svg>
      <span>Rezepte aus Datei importieren</span>
    </button>
    <button id="data-import-link" class="sheet-option">
      <svg class="option-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 12h12M12 6v12"></path></svg>
      <span>Backup-Link importieren</span>
    </button>
    <input id="data-import-file" type="file" accept="application/json,.json" hidden>
    <p id="data-status" class="status"></p>
    <button id="data-cancel" class="sheet-cancel">Schließen</button>
  </div>
</template>

<template id="tpl-share-choice">
  <div class="sheet">
    <h2>Rezept teilen</h2>
    <button id="share-link" class="sheet-option">
      <svg class="option-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M10 13a5 5 0 0 1 0-7l1-1a5 5 0 0 1 7 7l-1 1M14 11a5 5 0 0 1 0 7l-1 1a5 5 0 1 1-7-7l1-1"></path></svg>
      <span>Als Link teilen</span>
    </button>
    <button id="share-text" class="sheet-option">
      <svg class="option-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"></path></svg>
      <span>Als Text teilen</span>
    </button>
    <button id="share-cancel" class="sheet-cancel">Abbrechen</button>
  </div>
</template>

<template id="tpl-add-menu">
  <div class="sheet">
    <h2>Rezept hinzufügen</h2>
    <button id="add-via-url" class="sheet-option">
      <svg class="option-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="3.5" y="4.5" width="17" height="15" rx="2"></rect>
        <path d="M3.5 8.5h17M7 6.5h.01M10 6.5h.01M8 12h8M8 15h5"></path>
      </svg>
      <span>Von Webseite (URL)</span>
    </button>
    <button id="add-via-scan" class="sheet-option">
      <svg class="option-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      <span>Buchseite scannen</span>
    </button>
    <button id="add-via-manual" class="sheet-option">
      <svg class="option-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 5 5 5M4 20l4.5-1 11-11a2.1 2.1 0 0 0-3-3l-11 11L4 20Z"></path></svg>
      <span>Manuell eingeben</span>
    </button>
    <button id="add-cancel" class="sheet-cancel">Abbrechen</button>
  </div>
</template>

<template id="tpl-url-import">
  <div class="form">
    <label>Rezept-URL
      <input id="url-input" type="url" placeholder="https://…">
    </label>
    <button id="url-fetch-btn">Importieren</button>
    <p id="url-status" class="status"></p>
    <details id="url-fallback" hidden>
      <summary>Automatischer Import nicht möglich – Seiteninhalt manuell einfügen</summary>
      <p class="hint">Öffne die Seite und füge den Rezepttext mit Zutaten und Zubereitung hier ein. Andere Seitenbereiche werden ignoriert.</p>
      <textarea id="url-fallback-text" rows="8" placeholder="Text/HTML der Rezeptseite hier einfügen…"></textarea>
      <button id="url-fallback-parse">Aus eingefügtem Text extrahieren</button>
    </details>
  </div>
</template>

<template id="tpl-scan-import">
  <div class="form">
    <input id="scan-file" type="file" accept="image/*" capture="environment" hidden>
    <button id="scan-trigger" class="sheet-option">
      <svg class="option-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1Z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
      <span>Foto aufnehmen / auswählen</span>
    </button>
    <div id="scan-preview"></div>
    <p id="scan-status" class="status"></p>
  </div>
</template>

<template id="tpl-recipe-form">
  <form id="recipe-form" class="form">
    <label>Titel <input name="title" required></label>
    <label>Tags (mit Komma trennen)
      <input name="tags" type="text" autocomplete="off" placeholder="z.B. Hähnchen, schnell, vegetarisch">
    </label>
    <div id="tag-suggestions" class="chips tag-suggestions"></div>
    <label>Portionen (Basis) <input name="servings" type="number" min="1" value="4" required></label>
    <label>Zubereitungszeit (Min., optional) <input name="prepTime" type="number" min="0"></label>
    <label>Quelle (optional) <input name="source"></label>
    <label>Favorit <input name="favorite" type="checkbox"></label>
    <label>Bewertung <input name="rating" type="range" min="0" max="5" step="1" value="0"></label>
    <label>Notiz / Kommentar <textarea name="notes" rows="3" placeholder="Was war besonders gut, was beim nächsten Mal besser machen?"></textarea></label>
    <label>Bild (optional) <input name="image" type="file" accept="image/*"></label>
    <div id="image-preview"></div>

    <h3>Zutaten</h3>
    <div id="ingredient-rows"></div>
    <button type="button" id="add-ingredient-row" class="btn-secondary">+ Zutat</button>

    <h3>Zubereitungsschritte</h3>
    <div id="step-rows"></div>
    <button type="button" id="add-step-row" class="btn-secondary">+ Schritt</button>

    <div class="form-actions">
      <button type="submit" class="btn-primary">Speichern</button>
      <button type="button" id="form-cancel" class="btn-secondary">Abbrechen</button>
    </div>
  </form>
</template>

<div id="sheet-overlay" class="overlay" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
